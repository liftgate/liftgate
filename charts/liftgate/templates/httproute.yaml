{{- if .Values.gateway.create }}
{{- $api := include "liftgate.host" .Values.publicUrl }}
{{- $dashboard := include "liftgate.host" (include "liftgate.dashboardUrl" .) }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "liftgate.fullname" . }}-control-plane
  labels:
    {{- include "liftgate.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      sectionName: https-{{ $api | replace "." "-" }}
  hostnames:
    - {{ $api | quote }}
  rules:
    - matches:
        {{- range eq $api $dashboard | ternary (list "/api") (list "/") }}
        - path:
            type: PathPrefix
            value: {{ . }}
        {{- end }}
      backendRefs:
        - name: {{ include "liftgate.fullname" . }}-control-plane
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "liftgate.fullname" . }}-dashboard
  labels:
    {{- include "liftgate.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      sectionName: https-{{ $dashboard | replace "." "-" }}
  hostnames:
    - {{ $dashboard | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "liftgate.fullname" . }}-dashboard
          port: 3000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "liftgate.fullname" . }}-https-redirect
  labels:
    {{- include "liftgate.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      sectionName: http
  hostnames:
    {{- range include "liftgate.hosts" . | fromJsonArray }}
    - {{ . | quote }}
    {{- end }}
    - "*.{{ .Values.deployDomain }}"
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
{{- end }}

profile: single

imagePullSecrets: []

controlPlane:
  image: ghcr.io/liftgate/control-plane
  tag: ""
  replicas:
    api: 3
    reconciler: 2
    builder: 2
    meter: 1
  logLevel: INFO
  trustedProxies: 1
  javaOpts: -XX:MaxRAMPercentage=75.0
  resources:
    requests:
      cpu: 250m
      memory: 768Mi
    limits:
      memory: 1536Mi
  clientIpHeader: ""
  upstreamOverwritesClientIpHeader: false
  trustedProxyCidrs: []
  databasePoolSize: 0

dashboard:
  image: ghcr.io/liftgate/dashboard
  tag: ""
  landing: false
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi

postgres:
  managed: true
  externalUrl: ""
  externalUser: ""
  externalPassword: ""
  storage: 10Gi
  maxConnections: 100
  backup:
    enabled: false
    endpointUrl: ""
    destinationPath: ""
    credentialsSecret: liftgate-postgres-backup
    retention: 30d
    schedule: "0 0 3 * * *"
    serverName: ""
    recoverFrom: ""
    recoverTo: ""
  resources: {}

nats:
  managed: true
  externalUrl: ""
  config:
    jetstream:
      enabled: true
      fileStore:
        pvc:
          size: 5Gi
    cluster:
      enabled: false
      replicas: 3
  natsBox:
    enabled: false
  container:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 1Gi

gateway:
  create: true
  name: liftgate
  className: cilium
  namespace: ""
  wildcardSecret: liftgate-wildcard-tls
  issuer: letsencrypt

deployDomain: liftgate.app
publicUrl: https://liftgate.dev
dashboardUrl: ""

github:
  appId: ""
  clientId: ""
  clientSecret: ""
  webhookSecret: ""
  privateKey: ""

google:
  clientId: ""
  clientSecret: ""

gitlab:
  url: ""
  clientId: ""
  clientSecret: ""
  trustEmail: null

bitbucket:
  clientId: ""
  clientSecret: ""

email:
  smtpUrl: ""
  from: ""

passkeys:
  rpId: ""
  rpName: ""

secrets:
  masterKey: ""

registry: registry.liftgate.internal

build:
  image: ""
  namespace: liftgate-build
  registryCredentials: ""
  allowedEgressCidrs: []
  nodeSelector: {}
  tolerations: []
  logsMaxBytes: 536870912

runtimeClass: gvisor

nodeSelector: {}

registryInsecure: false

registryAuth: shared
registryTokenKey: ""
registryTokenCertificate: ""
registryPullPassword: ""
registryJanitorPassword: ""

prometheusUrl: http://prometheus.liftgate-system:9090

signup:
  mode: approval
  allow: []

legal:
  termsUrl: ""
  privacyUrl: ""
  aupUrl: ""

customDomains:
  enabled: true
  max: null
  cloudflare:
    zoneId: ""
    apiToken: ""
    cnameTarget: ""
    gatewayServerName: ""

allowSharedSite: false

allowUnsandboxedTenants: false

workloads:
  nodeSelector: {}
  tolerations: []

plans:
  free:
    ownedOrgs: 1
    projects: 3
    environmentsPerProject: 2
    services: 6
    cpuMillis: 1000
    memoryMb: 1024
    replicas: 6
    cpuRequestRatio: 0.25
    ephemeralMb: 1024
    customDomains: 2
    concurrentBuilds: 1
    buildsPerHour: 10
    egressBandwidth: 20M
    udp: false
  unlimited: {}

defaultPlan: unlimited

deniedEgressCidrs: []

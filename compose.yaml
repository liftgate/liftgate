services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: liftgate
      POSTGRES_USER: liftgate
      POSTGRES_PASSWORD: liftgate
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  nats:
    image: nats:2
    command: ["--jetstream", "--store_dir", "/data"]
    ports:
      - "4222:4222"
    volumes:
      - nats-data:/data

volumes:
  postgres-data:
  nats-data:

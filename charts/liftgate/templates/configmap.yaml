apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "liftgate.fullname" . }}
  labels:
    {{- include "liftgate.labels" . | nindent 4 }}
data:
  LIFTGATE_DATABASE_URL: {{ include "liftgate.databaseUrl" . | quote }}
  LIFTGATE_NATS_URL: {{ include "liftgate.natsUrl" . | quote }}
  LIFTGATE_HAZELCAST_CLUSTER: {{ include "liftgate.fullname" . | quote }}
  LIFTGATE_HAZELCAST_KUBERNETES: {{ include "liftgate.ha" . | quote }}
  LIFTGATE_PUBLIC_URL: {{ .Values.publicUrl | quote }}
  LIFTGATE_DASHBOARD_URL: {{ include "liftgate.dashboardUrl" . | quote }}
  LIFTGATE_TRUSTED_PROXIES: {{ .Values.controlPlane.trustedProxies | quote }}
  LIFTGATE_DEPLOY_DOMAIN: {{ .Values.deployDomain | quote }}
  {{- with .Values.github.appId }}
  LIFTGATE_GITHUB_APP_ID: {{ . | quote }}
  {{- end }}
  {{- with .Values.github.clientId }}
  LIFTGATE_GITHUB_CLIENT_ID: {{ . | quote }}
  {{- end }}
  {{- with .Values.google.clientId }}
  LIFTGATE_GOOGLE_CLIENT_ID: {{ . | quote }}
  {{- end }}
  {{- with .Values.gitlab.url }}
  LIFTGATE_GITLAB_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.gitlab.clientId }}
  LIFTGATE_GITLAB_CLIENT_ID: {{ . | quote }}
  {{- end }}
  {{- with .Values.bitbucket.clientId }}
  LIFTGATE_BITBUCKET_CLIENT_ID: {{ . | quote }}
  {{- end }}
  {{- with .Values.email.from }}
  LIFTGATE_EMAIL_FROM: {{ . | quote }}
  {{- end }}
  {{- with .Values.passkeys.rpId }}
  LIFTGATE_WEBAUTHN_RP_ID: {{ . | quote }}
  {{- end }}
  {{- with .Values.passkeys.rpName }}
  LIFTGATE_WEBAUTHN_RP_NAME: {{ . | quote }}
  {{- end }}
  LIFTGATE_REGISTRY: {{ .Values.registry | quote }}
  LIFTGATE_BUILD_IMAGE: {{ .Values.build.image | default (printf "ghcr.io/liftgate/build-image:%s" .Chart.AppVersion) | quote }}
  LIFTGATE_BUILD_NAMESPACE: {{ .Values.build.namespace | quote }}
  {{- if .Values.runtimeClass }}
  LIFTGATE_RUNTIME_CLASS: {{ .Values.runtimeClass | quote }}
  {{- else if .Values.allowUnsandboxedTenants }}
  LIFTGATE_ALLOW_RUNC: "true"
  {{- else }}
  {{- fail "runtimeClass is empty: set it to a sandbox RuntimeClass such as gvisor (see infra/k3s/install.md), or set allowUnsandboxedTenants=true to run tenant code under runc on the node kernel" }}
  {{- end }}
  {{- with .Values.nodeSelector }}
  LIFTGATE_NODE_SELECTOR: {{ include "liftgate.nodeSelector" . | quote }}
  {{- end }}
  {{- if .Values.registryInsecure }}
  LIFTGATE_REGISTRY_INSECURE: "true"
  {{- end }}
  LIFTGATE_GATEWAY_NAMESPACE: {{ include "liftgate.gatewayNamespace" . | quote }}
  LIFTGATE_GATEWAY_NAME: {{ .Values.gateway.name | quote }}
  LIFTGATE_PROMETHEUS_URL: {{ .Values.prometheusUrl | quote }}
  LIFTGATE_LEADER_ELECTION: "kubernetes"
  LIFTGATE_HTTP_PORT: "8080"
  LIFTGATE_LOG_LEVEL: {{ .Values.controlPlane.logLevel | quote }}
  LIFTGATE_NATS_REPLICAS: {{ ternary "3" "1" (and .Values.nats.managed .Values.nats.config.cluster.enabled) | quote }}
  LIFTGATE_SIGNUP: {{ .Values.signup.mode | quote }}
  {{- with .Values.signup.allow }}
  LIFTGATE_SIGNUP_ALLOW: {{ join "," . | quote }}
  {{- end }}
  {{- with .Values.legal.termsUrl }}
  LIFTGATE_TERMS_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.legal.privacyUrl }}
  LIFTGATE_PRIVACY_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.legal.aupUrl }}
  LIFTGATE_AUP_URL: {{ . | quote }}
  {{- end }}
  {{- if kindIs "bool" .Values.gitlab.trustEmail }}
  LIFTGATE_GITLAB_TRUST_EMAIL: {{ .Values.gitlab.trustEmail | quote }}
  {{- end }}
  LIFTGATE_CUSTOM_DOMAINS_ENABLED: {{ .Values.customDomains.enabled | quote }}
  {{- with .Values.controlPlane.clientIpHeader }}
  {{- if not $.Values.controlPlane.upstreamOverwritesClientIpHeader }}
  {{- fail (printf "controlPlane.clientIpHeader %s is trusted on every connection from trustedProxyCidrs, and the gateway forwards a %s header sent by the client unchanged; set it only when every request passes through an upstream proxy that overwrites %s, and confirm that with controlPlane.upstreamOverwritesClientIpHeader=true" . . .) }}
  {{- end }}
  LIFTGATE_CLIENT_IP_HEADER: {{ . | quote }}
  {{- end }}
  {{- with .Values.controlPlane.trustedProxyCidrs }}
  LIFTGATE_TRUSTED_PROXY_CIDRS: {{ join "," . | quote }}
  {{- end }}
  {{- with .Values.workloads.nodeSelector }}
  LIFTGATE_WORKLOAD_NODE_SELECTOR: {{ include "liftgate.nodeSelector" . | quote }}
  {{- end }}
  {{- with .Values.workloads.tolerations }}
  LIFTGATE_WORKLOAD_TOLERATIONS: {{ join "," . | quote }}
  {{- end }}
  {{- with .Values.registryAuth }}
  LIFTGATE_REGISTRY_AUTH: {{ . | quote }}
  {{- end }}
  {{- with .Values.registryTokenCertificate }}
  LIFTGATE_REGISTRY_TOKEN_CERTIFICATE: {{ . | quote }}
  {{- end }}
  {{- with .Values.build.nodeSelector }}
  LIFTGATE_BUILD_NODE_SELECTOR: {{ include "liftgate.nodeSelector" . | quote }}
  {{- end }}
  {{- with .Values.build.tolerations }}
  LIFTGATE_BUILD_TOLERATIONS: {{ join "," . | quote }}
  {{- end }}
{{- with include "liftgate.sharedSite" . }}
{{- if not $.Values.allowSharedSite }}
{{- fail (printf "deployDomain %s shares the site %s with publicUrl or dashboardUrl, so tenant apps would be same-site with the dashboard; use a separate registrable domain, or set allowSharedSite=true if %s is a public suffix such as co.uk" $.Values.deployDomain . .) }}
{{- end }}
{{- end }}

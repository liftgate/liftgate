{{- define "liftgate.controlPlaneContainer" }}
{{- $root := index . 0 -}}
image: "{{ $root.Values.controlPlane.image }}:{{ $root.Values.controlPlane.tag | default $root.Chart.AppVersion }}"
imagePullPolicy: IfNotPresent
env:
  - name: LIFTGATE_ROLE
    value: {{ index . 2 }}
  - name: JAVA_TOOL_OPTIONS
    value: {{ $root.Values.controlPlane.javaOpts | quote }}
  {{- if $root.Values.postgres.managed }}
  - name: LIFTGATE_DATABASE_USER
    valueFrom:
      secretKeyRef:
        name: {{ include "liftgate.postgresCluster" $root }}-app
        key: username
  - name: LIFTGATE_DATABASE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: {{ include "liftgate.postgresCluster" $root }}-app
        key: password
  {{- end }}
envFrom:
  - configMapRef:
      name: {{ include "liftgate.fullname" $root }}
  - secretRef:
      name: {{ include "liftgate.roleName" (list $root (index . 1)) }}
resources:
  {{- toYaml $root.Values.controlPlane.resources | nindent 2 }}
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
{{- end }}
{{- range $role, $replicas := include "liftgate.roles" . | fromJson }}
{{- $hazelcast := has $role (list "api" "all") }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "liftgate.fullname" $ }}-{{ eq $role "all" | ternary "control-plane" $role }}
  labels:
    {{- include "liftgate.labels" $ | nindent 4 }}
    app.kubernetes.io/component: control-plane
    liftgate.dev/role: {{ $role }}
spec:
  replicas: {{ $replicas }}
  selector:
    matchLabels:
      {{- include "liftgate.selectorLabels" $ | nindent 6 }}
      liftgate.dev/role: {{ $role }}
  template:
    metadata:
      labels:
        {{- include "liftgate.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: control-plane
        liftgate.dev/role: {{ $role }}
        {{- if $hazelcast }}
        liftgate.dev/hazelcast: "true"
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") $ | sha256sum }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: {{ include "liftgate.roleName" (list $ $role) }}
      terminationGracePeriodSeconds: 60
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      {{- if gt (int $replicas) 1 }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "liftgate.selectorLabels" $ | nindent 20 }}
                    liftgate.dev/role: {{ $role }}
      {{- end }}
      initContainers:
        - name: migrate
          {{- include "liftgate.controlPlaneContainer" (list $ $role "migrate") | nindent 10 }}
      containers:
        - name: control-plane
          {{- include "liftgate.controlPlaneContainer" (list $ $role $role) | nindent 10 }}
          ports:
            - name: http
              containerPort: 8080
            {{- if $hazelcast }}
            - name: hazelcast
              containerPort: 5701
            {{- end }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
{{- end }}

{{- if and .Values.postgres.managed .Values.postgres.backup.enabled }}
{{- with .Values.postgres.backup }}
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: {{ include "liftgate.postgresCluster" $ }}
  labels:
    {{- include "liftgate.labels" $ | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  retentionPolicy: {{ .retention | quote }}
  configuration:
    destinationPath: {{ required "postgres.backup.destinationPath is required when backups are enabled" .destinationPath | quote }}
    {{- with .endpointUrl }}
    endpointURL: {{ . | quote }}
    {{- end }}
    s3Credentials:
      accessKeyId:
        name: {{ .credentialsSecret }}
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: {{ .credentialsSecret }}
        key: ACCESS_SECRET_KEY
      region:
        name: {{ .credentialsSecret }}
        key: ACCESS_REGION
    wal:
      compression: gzip
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: {{ include "liftgate.postgresServerName" $ }}
  labels:
    {{- include "liftgate.labels" $ | nindent 4 }}
spec:
  schedule: {{ .schedule | quote }}
  immediate: true
  cluster:
    name: {{ include "liftgate.postgresCluster" $ }}
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
{{- end }}
{{- end }}

name: upgrade

on:
  push:
    branches: [main]
    paths:
      - control-plane/**
      - dashboard/**
      - charts/**
      - e2e/**
      - infra/**
      - .github/workflows/upgrade.yml
  pull_request:
  workflow_call:

permissions:
  contents: read
  packages: read

concurrency:
  group: upgrade-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrations:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: new migrations drop or rename nothing
        run: |
          changed="$(git diff --name-only --diff-filter=AM HEAD^ -- control-plane/src/main/resources/db/migration)"
          if [ -n "$changed" ] && grep -EiwHn 'drop|rename' $changed; then exit 1; fi

  upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: control-plane
          load: true
          tags: liftgate/control-plane:e2e
          cache-from: type=gha,scope=e2e-control-plane
      - uses: docker/build-push-action@v7
        with:
          context: dashboard
          load: true
          tags: liftgate/dashboard:e2e
          cache-from: type=gha,scope=e2e-dashboard
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: azure/setup-helm@v5
        with:
          version: v4.3.0
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - run: sh e2e/upgrade.sh
      - name: diagnostics
        if: failure()
        run: |
          kubectl get pods --all-namespaces
          kubectl -n liftgate-system describe pods
          kubectl -n liftgate-system logs deployment/liftgate-control-plane --tail=400 || true
          kubectl -n liftgate-system get events --sort-by=.lastTimestamp | tail -60

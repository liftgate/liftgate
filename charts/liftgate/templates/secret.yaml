{{- $values := dict
  "LIFTGATE_SECRETS_MASTER_KEY" (list .Values.secrets.masterKey "api" "reconciler" "builder")
  "LIFTGATE_GITHUB_APP_PRIVATE_KEY" (list .Values.github.privateKey "api" "builder")
  "LIFTGATE_GITHUB_WEBHOOK_SECRET" (list .Values.github.webhookSecret "api")
  "LIFTGATE_GITHUB_CLIENT_SECRET" (list .Values.github.clientSecret "api")
  "LIFTGATE_GOOGLE_CLIENT_SECRET" (list .Values.google.clientSecret "api")
  "LIFTGATE_GITLAB_CLIENT_SECRET" (list .Values.gitlab.clientSecret "api")
  "LIFTGATE_BITBUCKET_CLIENT_SECRET" (list .Values.bitbucket.clientSecret "api")
  "LIFTGATE_SMTP_URL" (list .Values.email.smtpUrl "api")
  "LIFTGATE_REGISTRY_TOKEN_KEY" (list .Values.registryTokenKey "api")
  "LIFTGATE_REGISTRY_PULL_PASSWORD" (list .Values.registryPullPassword "api")
  "LIFTGATE_REGISTRY_JANITOR_PASSWORD" (list .Values.registryJanitorPassword "api" "builder") }}
{{- range $role, $_ := include "liftgate.roles" . | fromJson }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "liftgate.roleName" (list $ $role) }}
  labels:
    {{- include "liftgate.labels" $ | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $entry := $values }}
  {{- if and (first $entry) (or (eq $role "all") (has $role (rest $entry))) }}
  {{ $key }}: {{ first $entry | quote }}
  {{- end }}
  {{- end }}
  {{- if not $.Values.postgres.managed }}
  LIFTGATE_DATABASE_USER: {{ $.Values.postgres.externalUser | quote }}
  LIFTGATE_DATABASE_PASSWORD: {{ $.Values.postgres.externalPassword | quote }}
  {{- end }}
{{- end }}

name: e2e

on:
  push:
    branches: [main]
    paths:
      - control-plane/**
      - dashboard/**
      - charts/**
      - e2e/**
      - infra/**
      - .github/workflows/e2e.yml
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: control-plane
          load: true
          tags: liftgate/control-plane:e2e
          cache-from: type=gha,scope=e2e-control-plane
          cache-to: type=gha,mode=max,scope=e2e-control-plane
      - uses: docker/build-push-action@v7
        with:
          context: dashboard
          load: true
          tags: liftgate/dashboard:e2e
          cache-from: type=gha,scope=e2e-dashboard
          cache-to: type=gha,mode=max,scope=e2e-dashboard
      - uses: azure/setup-helm@v5
        with:
          version: v4.3.0
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - name: cluster
        run: sh e2e/cluster.sh
      - name: checks
        run: sh e2e/run.sh
      - name: diagnostics
        if: failure()
        run: |
          kubectl get pods --all-namespaces
          kubectl -n liftgate-system describe pods
          kubectl -n liftgate-system logs deployment/liftgate-control-plane --tail=400 || true
          kubectl -n env-e2e describe pods || true
          kubectl get gateways,httproutes --all-namespaces -o yaml || true
          kubectl -n liftgate-system get events --sort-by=.lastTimestamp | tail -60

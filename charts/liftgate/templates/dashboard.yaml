{{- if and .Values.dashboard.landing (ne (include "liftgate.host" .Values.publicUrl) (include "liftgate.host" (include "liftgate.dashboardUrl" .))) }}
{{- fail "dashboard.landing needs dashboardUrl empty or on the publicUrl host: the session cookie is host-only, so a dashboard on another host would show signed-in users the signed-out landing page" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "liftgate.fullname" . }}-dashboard
  labels:
    {{- include "liftgate.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  replicas: {{ eq (include "liftgate.ha" .) "true" | ternary 2 1 }}
  selector:
    matchLabels:
      {{- include "liftgate.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: dashboard
  template:
    metadata:
      labels:
        {{- include "liftgate.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: dashboard
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dashboard
          image: "{{ .Values.dashboard.image }}:{{ .Values.dashboard.tag | default .Chart.AppVersion }}"
          imagePullPolicy: IfNotPresent
          env:
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: PORT
              value: "3000"
            - name: LIFTGATE_LANDING
              value: {{ .Values.dashboard.landing | default false | quote }}
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 20
          resources:
            {{- toYaml .Values.dashboard.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]

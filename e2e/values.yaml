profile: single

controlPlane:
  image: liftgate/control-plane
  tag: e2e
  logLevel: DEBUG
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1024Mi

dashboard:
  image: liftgate/dashboard
  tag: e2e

postgres:
  storage: 1Gi

nats:
  config:
    jetstream:
      fileStore:
        pvc:
          size: 1Gi

publicUrl: http://liftgate.test

gateway:
  issuer: selfsigned

runtimeClass: ""
allowUnsandboxedTenants: true

workloads:
  storageClass: standard

deniedEgressCidrs:
  - 1.0.0.1/32

plans:
  rollout:
    cronTimeoutSeconds: 20
  data:
    cpuMillis: 4000
    cpuRequestRatio: 0.1
    memoryMb: 4096
    replicas: 10
    ephemeralMb: 1024
    storageGb: 10

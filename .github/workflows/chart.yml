name: chart

on:
  push:
    branches: [main]
    paths:
      - charts/**
      - infra/**
      - .github/workflows/chart.yml
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: chart-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (${{ matrix.profile }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - profile: single
            args: --set profile=single
          - profile: ha
            args: --values charts/liftgate/values-ha.yaml --set postgres.backup.destinationPath=s3://liftgate-pg/
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v4.3.0
      - run: helm dependency update charts/liftgate
      - run: helm lint charts/liftgate ${{ matrix.args }}
      - run: helm template liftgate charts/liftgate ${{ matrix.args }} --api-versions cilium.io/v2/CiliumClusterwideNetworkPolicy > /dev/null
      - run: "! helm template liftgate charts/liftgate ${{ matrix.args }} --set deployDomain=apps.example.com --set publicUrl=https://liftgate.example.com"
      - name: sandbox and build egress guards
        run: |
          set -o pipefail
          if helm template liftgate charts/liftgate ${{ matrix.args }} --set runtimeClass= 2> render.err; then exit 1; fi
          grep "runtimeClass is empty" render.err
          helm template liftgate charts/liftgate ${{ matrix.args }} --set runtimeClass= --set allowUnsandboxedTenants=true --show-only templates/configmap.yaml | grep 'LIFTGATE_ALLOW_RUNC: "true"'
          helm template liftgate charts/liftgate ${{ matrix.args }} --set-json 'build.allowedEgressCidrs=[{"cidr":"10.200.0.1/32","ports":[5050]}]' --show-only templates/networkpolicy.yaml \
            | yq -e 'select(.metadata.name == "build-isolation") | .spec.egress | (length == 3 and .[1].to[0].ipBlock.except[0] == "10.0.0.0/8" and .[2].to[0].ipBlock.cidr == "10.200.0.1/32" and (.[2].ports | length) == 1 and .[2].ports[0].protocol == "TCP" and .[2].ports[0].port == 5050)'
      - name: build egress ports, denied cidrs and platform resources
        run: |
          set -o pipefail
          helm template liftgate charts/liftgate ${{ matrix.args }} --set-json 'deniedEgressCidrs=["203.0.113.7/32"]' --set postgres.resources.requests.memory=512Mi | yq ea -o json '[.]' > rendered.json
          jq -e '.[] | select(.metadata.name == "build-isolation") | .spec.egress[1]
            | .to[0].ipBlock.except[-1] == "203.0.113.7/32" and .ports == ([[1, 24], [26, 464], [466, 586], [588, 2524], [2526, 65535]] | map({protocol: "TCP", port: .[0], endPort: .[1]}))' rendered.json
          jq -e '.[] | select(.kind == "ConfigMap" and .metadata.name == "liftgate") | .data.LIFTGATE_DENIED_EGRESS_CIDRS == "203.0.113.7/32"' rendered.json
          jq -e '[.[] | select(.kind == "StatefulSet" and .metadata.name == "liftgate-nats") | .spec.template.spec.containers[] | select(.name == "nats") | .resources.requests.memory] == ["128Mi"]' rendered.json
          jq -e '[.[] | select(.kind == "Cluster") | .spec.resources.requests.memory] == ["512Mi"]' rendered.json
          for cidr in fd00::/8 999.0.0.1/32; do
            if helm template liftgate charts/liftgate ${{ matrix.args }} --set-json "deniedEgressCidrs=[\"$cidr\"]" 2> render.err; then exit 1; fi
            grep "/deniedEgressCidrs" render.err
          done
      - name: gitlab, deploy domain and client ip guards
        run: |
          set -o pipefail
          render() { helm template liftgate charts/liftgate ${{ matrix.args }} --show-only templates/configmap.yaml "$@"; }
          render > default.yaml
          if grep LIFTGATE_GITLAB_TRUST_EMAIL default.yaml; then exit 1; fi
          render --set gitlab.trustEmail=false | grep 'LIFTGATE_GITLAB_TRUST_EMAIL: "false"'
          render --set gitlab.trustEmail=true | grep 'LIFTGATE_GITLAB_TRUST_EMAIL: "true"'
          if render --set gitlab.url=http://gitlab.example.com 2> render.err; then exit 1; fi
          grep "/gitlab/url" render.err
          if render --set deployDomain="$(printf 'a%.0s' $(seq 186)).app" 2> render.err; then exit 1; fi
          grep "/deployDomain" render.err
          if render --set controlPlane.clientIpHeader=CF-Connecting-IP --set controlPlane.trustedProxyCidrs={10.0.0.0/8} 2> render.err; then exit 1; fi
          grep "upstreamOverwritesClientIpHeader=true" render.err
          render --set controlPlane.clientIpHeader=CF-Connecting-IP --set controlPlane.trustedProxyCidrs={10.0.0.0/8} --set controlPlane.upstreamOverwritesClientIpHeader=true | grep 'LIFTGATE_CLIENT_IP_HEADER: "CF-Connecting-IP"'
      - name: landing guard
        run: |
          set -o pipefail
          if helm template liftgate charts/liftgate ${{ matrix.args }} --set dashboard.landing=true --set dashboardUrl=https://dashboard.example.com 2> render.err; then exit 1; fi
          grep "dashboard.landing needs" render.err
          helm template liftgate charts/liftgate ${{ matrix.args }} --set dashboard.landing=true --show-only templates/dashboard.yaml | grep -A1 "name: LIFTGATE_LANDING" | grep 'value: "true"'
      - name: control plane service accounts, probes, secrets and routes
        run: |
          set -o pipefail
          helm template liftgate charts/liftgate ${{ matrix.args }} --set secrets.masterKey=key --set github.appId=1 --set github.privateKey=key \
            --set dashboardUrl=https://dashboard.liftgate.dev | yq ea -o json '[.]' > rendered.json
          jq -e '([.[] | select(.kind == "ServiceAccount")] | length) == ([.[] | select(.kind == "Deployment" and .metadata.labels["app.kubernetes.io/component"] == "control-plane")] | length)' rendered.json
          jq -e '[.[] | select(.kind == "Deployment") | .spec.template.spec.containers[0]] | all(.readinessProbe and .livenessProbe)' rendered.json
          jq -e '[.[] | select(.kind == "Deployment" and .metadata.labels["app.kubernetes.io/component"] == "control-plane") | .spec.template.spec] | all(.initContainers[0].env[0].value == "migrate" and .containers[0].startupProbe)' rendered.json
          jq -e '[.[] | select(.spec.template.metadata.labels["liftgate.dev/hazelcast"] == "true") | .metadata.labels["liftgate.dev/role"]] | . == ["api"] or . == ["all"]' rendered.json
          jq -e '(map(select(.kind == "Secret")) | INDEX(.metadata.name)) as $secrets
            | [.[] | select(.kind == "Deployment" and .metadata.labels["liftgate.dev/role"] == "meter") | .spec.template.spec.containers[0].envFrom[].secretRef.name // empty | $secrets[.].stringData // {} | keys[]]
            | index("LIFTGATE_SECRETS_MASTER_KEY") == null and index("LIFTGATE_GITHUB_APP_PRIVATE_KEY") == null' rendered.json
          jq -e '(map(select(.kind == "Secret")) | INDEX(.metadata.name)) as $secrets
            | [.[] | select(.kind == "Deployment" and .metadata.labels["liftgate.dev/role"] == "builder") | .spec.template.spec.containers[0].envFrom[].secretRef.name // empty | $secrets[.].stringData // {} | has("LIFTGATE_SECRETS_MASTER_KEY")]
            | all' rendered.json
          jq -e '.[] | select(.kind == "HTTPRoute" and .metadata.name == "liftgate-control-plane") | .spec.rules[0].matches == [{path: {type: "PathPrefix", value: "/api"}}]' rendered.json
      - name: custom domain edge mode
        run: |
          set -o pipefail
          render() { helm template liftgate charts/liftgate ${{ matrix.args }} "$@"; }
          edge="--set customDomains.cloudflare.zoneId=0123456789abcdef --set customDomains.cloudflare.apiToken=token --set customDomains.cloudflare.gatewayServerName=edge.example.net"
          render $edge | yq ea -o json '[.]' > rendered.json
          jq -e '.[] | select(.kind == "Gateway") | .spec.listeners[] | select(.name == "https-edge") | .hostname == null and .tls.certificateRefs[0].name == "liftgate-edge-tls"' rendered.json
          jq -e '.[] | select(.kind == "Certificate" and .metadata.name == "liftgate-edge") | .spec.dnsNames == ["edge.example.net"] and .spec.secretName == "liftgate-edge-tls"' rendered.json
          jq -e '.[] | select(.kind == "ConfigMap" and .metadata.name == "liftgate") | .data.LIFTGATE_CLOUDFLARE_ZONE_ID == "0123456789abcdef"' rendered.json
          jq -e '[.[] | select(.kind == "Secret" and .stringData.LIFTGATE_CLOUDFLARE_API_TOKEN == "token") | .metadata.name | test("^liftgate(-api|-reconciler)?$")] | length > 0 and all' rendered.json
          jq -e '[.[] | select(.kind == "Secret" and (.metadata.name | test("-(builder|meter)$"))) | .stringData.LIFTGATE_CLOUDFLARE_API_TOKEN] | all(. == null)' rendered.json
          if render | grep -e https-edge -e LIFTGATE_CLOUDFLARE; then exit 1; fi
          if render --set customDomains.cloudflare.zoneId=0123456789abcdef 2> render.err; then exit 1; fi
          grep "/customDomains/cloudflare" render.err
          if render $edge --set customDomains.cloudflare.gatewayServerName=edge.liftgate.app 2> render.err; then exit 1; fi
          grep "gatewayServerName must be" render.err

  rules:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: promtool check rules and unit tests
        run: |
          docker run --rm -v "$PWD/infra/prometheus:/rules:ro" -w /rules --entrypoint sh quay.io/prometheus/prometheus:v3.14.0 \
            -c 'promtool check rules rules.yaml && promtool test rules rules.test.yaml'

  install-kindnet:
    runs-on: ubuntu-24.04
    env:
      LETSENCRYPT_EMAIL: ci@liftgate.test
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v4.3.0
      - uses: helm/kind-action@v1
      - name: install.sh refuses a cluster with another CNI and changes nothing
        run: |
          for cilium in 0 1; do
            if LIFTGATE_INSTALL_CILIUM=$cilium sh infra/install.sh; then exit 1; fi
          done
          test -z "$(helm list --all-namespaces --short)"
          test -z "$(kubectl get crds --output name)"

  install-k3s:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      LIFTGATE_INSTALL_CILIUM: "1"
      LETSENCRYPT_EMAIL: ci@liftgate.test
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v4.3.0
      - name: k3s as in infra/k3s/install.md, without the podman CNI config the runner ships
        run: |
          sudo rm -f /etc/cni/net.d/87-podman-bridge.conflist
          curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION=v1.34.8+k3s1 INSTALL_K3S_EXEC='server --flannel-backend=none --disable-network-policy --disable-kube-proxy --disable=traefik --disable=servicelb --write-kubeconfig-mode=644' sh -
          for attempt in $(seq 60); do
            kubectl get nodes -o jsonpath='{.items[*].status.conditions[?(@.type=="Ready")].message}' | grep -q NetworkReady=false && break
            sleep 2
          done
      - run: sh infra/install.sh
      - name: a second run changes no release
        run: |
          before="$(helm list --all-namespaces --output json)"
          sh infra/install.sh
          test "$(helm list --all-namespaces --output json)" = "$before"
      - name: controllers whose CRDs outlived them are reinstalled
        run: |
          helm uninstall cert-manager --namespace cert-manager --wait
          helm uninstall plugin-barman-cloud cnpg --namespace cnpg-system --wait
          kubectl get crd certificates.cert-manager.io clusters.postgresql.cnpg.io objectstores.barmancloud.cnpg.io
          sh infra/install.sh
          kubectl --namespace cert-manager get deployment cert-manager
          kubectl --namespace cnpg-system get deployment cnpg-cloudnative-pg plugin-barman-cloud
      - name: the plugin joins an operator in another namespace
        run: |
          helm uninstall plugin-barman-cloud cnpg --namespace cnpg-system --wait
          kubectl delete crd objectstores.barmancloud.cnpg.io
          helm install cnpg cloudnative-pg --repo https://cloudnative-pg.github.io/charts --version "$(sed -n 's/^CNPG_VERSION=//p' infra/install.sh)" \
            --namespace postgres-operator --create-namespace --take-ownership --wait --timeout 10m
          sh infra/install.sh
          kubectl --namespace postgres-operator get deployment plugin-barman-cloud
          test -z "$(helm list --namespace cnpg-system --short)"
      - name: diagnostics
        if: failure()
        run: |
          kubectl get nodes -o jsonpath='{range .items[*].status.conditions[*]}{.type}={.status} {.message}{"\n"}{end}'
          ls -la /etc/cni/net.d /opt/cni/bin || true
          sudo journalctl -u k3s --no-pager | grep -i cni | tail -40

apiVersion: v1
kind: Service
metadata:
  name: {{ include "liftgate.fullname" . }}-dashboard
  labels:
    {{- include "liftgate.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  type: ClusterIP
  selector:
    {{- include "liftgate.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
  ports:
    - name: http
      port: 3000
      targetPort: http

server:
  fullnameOverride: prometheus
  retention: 15d
  retentionSize: 6GB
  persistentVolume:
    size: 8Gi
  service:
    servicePort: 9090
  resources:
    requests:
      cpu: 100m
      memory: 1Gi
serverFiles:
  prometheus.yml:
    rule_files:
      - /etc/config/liftgate
extraScrapeConfigs: |
  - job_name: cnpg
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_cnpg_io_cluster, __meta_kubernetes_pod_container_port_name, __meta_kubernetes_pod_phase]
        regex: .+;metrics;Running
        action: keep
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_pod_label_cnpg_io_cluster]
        target_label: cluster
alertmanager:
  enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
  extraSecretMounts:
    - name: receivers
      mountPath: /etc/alertmanager/receivers
      secretName: liftgate-alerts
      readOnly: true
      optional: true
  config:
    receivers:
      - name: none
      - name: discord
        discord_configs:
          - webhook_url_file: /etc/alertmanager/receivers/discord-webhook-url
      - name: ntfy
        webhook_configs:
          - url_file: /etc/alertmanager/receivers/ntfy-url
    route:
      receiver: none
      group_by: [alertname]
kube-state-metrics:
  enabled: true
  collectors: [pods, nodes, persistentvolumeclaims]
  metricLabelsAllowlist:
    - pods=[liftgate.dev/service-id,liftgate.dev/org-id]
    - persistentvolumeclaims=[cnpg.io/cluster]
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 256Mi
prometheus-node-exporter:
  enabled: true
  hostNetwork: false
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
prometheus-pushgateway:
  enabled: false

{{- if .Capabilities.APIVersions.Has "cilium.io/v2/CiliumClusterwideNetworkPolicy" }}
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: {{ include "liftgate.fullname" . }}-databases-to-apiserver
  labels:
    {{- include "liftgate.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchExpressions:
      - key: liftgate.dev/database-id
        operator: Exists
  egress:
    - toEntities:
        - kube-apiserver
{{- end }}
